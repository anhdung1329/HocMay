<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Thi Trắc Nghiệm Online</title>
    <style>
        /* Giữ nguyên CSS cũ của bạn */
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { background: white; width: 100%; max-width: 800px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .mode-section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .mode-title { font-weight: bold; margin-bottom: 10px; color: #444; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        button { border: none; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-mix { background: var(--primary); color: white; }
        .btn-mix:hover { background: #1d4ed8; }
        .btn-chap { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .btn-chap:hover { background: #bae6fd; }
        .hidden { display: none; }
        .quiz-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #666; background: #f8fafc; padding: 10px; border-radius: 8px; }
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn { background: #fff; border: 2px solid #e5e7eb; padding: 15px; border-radius: 8px; text-align: left; cursor: pointer; position: relative; }
        .option-btn:hover { background: #f8fafc; border-color: var(--primary); }
        .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
        .option-btn.disabled { pointer-events: none; }
        .controls { margin-top: 20px; text-align: right; }
        .btn-next { background: var(--primary); color: white; padding: 10px 25px; border-radius: 6px; display: none; }
        .btn-home { background: #64748b; color: white; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1 style="text-align: center; color: var(--primary);">Ngân Hàng Câu Hỏi</h1>
            <p style="text-align: center;">Tổng số: <span id="total-questions">0</span> câu</p>

            <div class="mode-section">
                <div class="mode-title">📚 Luyện tập ngẫu nhiên</div>
                <div class="btn-grid">
                    <button class="btn-mix" onclick="startQuiz('mix', 10)">10 câu ngẫu nhiên</button>
                    <button class="btn-mix" onclick="startQuiz('mix', 40)">40 câu (Thi thử)</button>
                    <button class="btn-mix" onclick="startQuiz('mix', 'all')">Tất cả câu hỏi</button>
                </div>
            </div>

            <div class="mode-section" style="border: none;">
                <div class="mode-title">📖 Luyện theo Bộ đề / Chương</div>
                <div class="btn-grid" id="chapter-buttons"></div>
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="chapter-info">Bộ đề</span>
                <span id="progress">Câu 1/10</span>
                <span id="score" style="color: var(--primary)">Điểm: 0</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="controls">
                <button class="btn-next" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>
            </div>
        </div>

        <div id="result-screen" class="hidden" style="text-align: center;">
            <h2>Kết quả</h2>
            <div style="font-size: 3rem; font-weight: bold; color: var(--primary); margin: 20px 0;">
                <span id="final-score">0</span>/<span id="final-total">0</span>
            </div>
            <p id="result-message">...</p>
            <button class="btn-home" onclick="location.reload()">🏠 Quay về màn hình chính</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        window.onload = function() {
            if (typeof questionBank !== 'undefined') {
                document.getElementById('total-questions').innerText = questionBank.length;
                generateChapterButtons();
            } else {
                alert("Chưa nạp dữ liệu câu hỏi!");
            }
        };

        // --- TÍNH NĂNG MỚI: Tự động tìm số lượng Bộ đề ---
        function generateChapterButtons() {
            const container = document.getElementById('chapter-buttons');
            
            // Tìm xem trong dữ liệu có những chương/bộ đề số mấy (ví dụ: 1, 2, ..., 13)
            // Lệnh này sẽ lấy ra danh sách các số chapter duy nhất
            const chapters = [...new Set(questionBank.map(q => q.chapter))].sort((a,b) => a - b);

            chapters.forEach(chapNum => {
                const count = questionBank.filter(q => q.chapter === chapNum).length;
                const btn = document.createElement('button');
                btn.className = 'btn-chap';
                
                // Hiển thị tên nút (Bạn có thể sửa chữ 'Bộ đề' thành 'Chương' nếu muốn)
                btn.innerHTML = `<b>Bộ đề ${chapNum}</b><br><small>(${count} câu)</small>`;
                btn.onclick = () => startQuiz('chapter', chapNum);
                container.appendChild(btn);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz(type, param) {
            let pool = [];
            let title = "";

            if (type === 'mix') {
                pool = [...questionBank];
                title = "Luyện tập ngẫu nhiên";
                shuffleArray(pool);
                if (param !== 'all') pool = pool.slice(0, param);
            } else if (type === 'chapter') {
                pool = questionBank.filter(q => q.chapter === param);
                title = `Luyện tập Bộ đề ${param}`;
                shuffleArray(pool); // Trộn câu hỏi trong bộ đề
            }

            if (pool.length === 0) { alert("Bộ đề này chưa có câu hỏi!"); return; }

            currentQuestions = pool;
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('chapter-info').innerText = title;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const data = currentQuestions[currentQuestionIndex];
            document.getElementById('progress').innerText = `Câu ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('next-btn').style.display = 'none';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            let answers = [...data.options];
            shuffleArray(answers);

            answers.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, data.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = `Điểm: ${score}`;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
            }
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = currentQuestions.length;
            
            const percent = (score / currentQuestions.length) * 100;
            let msg = percent >= 80 ? "Tuyệt vời! Bạn đã nắm vững kiến thức." : "Cần ôn tập thêm bạn nhé!";
            document.getElementById('result-message').innerText = msg;
        }
    </script>
</body>
</html>
