<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Trắc Nghiệm</title>
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { background: white; width: 100%; max-width: 600px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Màn hình chào */
        #start-screen, #result-screen { text-align: center; }
        button.btn-start { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 5px; width: 100%; max-width: 200px; transition: 0.2s; }
        button.btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Màn hình câu hỏi */
        .quiz-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #666; }
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #1f2937; line-height: 1.4; }
        
        .options-grid { display: grid; gap: 10px; }
        .option-btn { background: #f9fafb; border: 2px solid #e5e7eb; padding: 15px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 15px; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #eef2ff; border-color: var(--primary); }
        
        /* Trạng thái đúng/sai */
        .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: bold; }
        .option-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; opacity: 0.7; }
        .option-btn.disabled { pointer-events: none; }

        .controls { margin-top: 20px; text-align: right; }
        .btn-next { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Luyện Tập Trắc Nghiệm</h1>
            <p>Tổng số câu hỏi trong kho: <span id="total-questions">0</span></p>
            <p>Chọn chế độ ôn tập:</p>
            <button class="btn-start" onclick="startQuiz(10)">Ngẫu nhiên 10 câu</button> <br><br>
            <button class="btn-start" onclick="startQuiz(50)">Ngẫu nhiên 50 câu</button> <br><br>
            <button class="btn-start" onclick="startQuiz('all')">Làm tất cả câu hỏi</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="progress">Câu 1/10</span>
                <span id="score">Điểm: 0</span>
            </div>
            <div class="question-text" id="question-text">Nội dung câu hỏi...</div>
            <div class="options-grid" id="options-container">
                </div>
            <div class="controls">
                <button class="btn-next" id="next-btn" onclick="nextQuestion()">Câu tiếp theo</button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Hoàn thành!</h2>
            <p>Bạn đã trả lời đúng: <strong id="final-score" style="font-size: 24px; color: var(--primary)"></strong></p>
            <button class="btn-start" onclick="location.reload()">Làm lại bài mới</button>
        </div>
    </div>

    <script src="questions.js"></script>
    
    <script>
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        // Hiển thị tổng số câu hỏi khi load trang
        document.getElementById('total-questions').innerText = typeof questionBank !== 'undefined' ? questionBank.length : 0;

        // Thuật toán xáo trộn mảng (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Bắt đầu bài thi
        function startQuiz(amount) {
            if (typeof questionBank === 'undefined' || questionBank.length === 0) {
                alert("Lỗi: Không tìm thấy dữ liệu câu hỏi trong file questions.js!");
                return;
            }

            // 1. Sao chép và Random thứ tự câu hỏi
            let shuffled = shuffleArray([...questionBank]); 

            // 2. Cắt lấy số lượng câu mong muốn
            if (amount === 'all') {
                currentQuestions = shuffled;
            } else {
                currentQuestions = shuffled.slice(0, amount);
            }

            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const data = currentQuestions[currentQuestionIndex];
            
            // Cập nhật tiến độ
            document.getElementById('progress').innerText = `Câu ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('score').innerText = `Điểm: ${score}`;
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('next-btn').style.display = 'none';

            // Xử lý hiển thị đáp án (Random thứ tự nút bấm)
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Tạo một bản sao của mảng đáp án để xáo trộn mà không làm hỏng dữ liệu gốc
            // Chúng ta lưu kèm index gốc hoặc text để đối chiếu đúng sai
            let answersToShuffle = [...data.options];
            shuffleArray(answersToShuffle);

            answersToShuffle.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, data.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedValue, correctValue) {
            const buttons = document.querySelectorAll('.option-btn');
            
            // Vô hiệu hóa tất cả các nút để không click lại được
            buttons.forEach(btn => btn.classList.add('disabled'));

            if (selectedValue === correctValue) {
                // Đúng
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = `Điểm: ${score}`;
            } else {
                // Sai
                selectedBtn.classList.add('wrong');
                // Hiện đáp án đúng lên cho người dùng biết
                buttons.forEach(btn => {
                    if (btn.innerText === correctValue) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Hiện nút Next
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
        }
    </script>
</body>
</html>
